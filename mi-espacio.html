  body {

  .radio-widget {

  }

  .radio-widget .logo {

  .player-card {

    padding: 20px;

  .badge-personal {

    margin-bottom: 14px;

  .nota {
    font-size: 0.7rem;

    text-align: left;
    margin-bottom: 12px;

  }

  #yt-player-container {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    opacity: 0;
    pointer-events: none;
  }

  .now-playing {
    display: flex;
    align-items: center;
    gap: 12px;
    text-align: left;
    margin-bottom: 14px;
  }
  .now-playing img {
    width: 56px;

  .now-playing .titulo {
    font-size: 0.9rem;

    overflow: hidden;
    text-overflow: ellipsis;

  .now-playing .sub {

    color: #ffb366;
    margin-top: 2px;
  }

  .buscador {

    gap: 6px;

  }
  .buscador input {
    flex: 1;
    padding: 9px 12px;
    border-radius: 12px;
    border: 1px solid #245;
    background: #071019;
    color: #fff;
    font-size: 0.85rem;
    outline: none;
    min-width: 0;

  .buscador input:focus { border-color: #ff6b1a; }
  .buscador button {
    background: linear-gradient(145deg, #ff6b1a, #cc5200);
    border: none;
    color: #fff;
    font-weight: bold;
    border-radius: 12px;
    padding: 0 14px;
    cursor: pointer;
    font-size: 0.85rem;

  .buscador button:disabled { opacity: 0.5; cursor: default; }

  .resultados, .cola-lista {

    max-height: 220px;
    overflow-y: auto;
    margin-bottom: 4px;

  .item-fila {

    gap: 10px;

    border-bottom: 1px solid rgba(255,255,255,0.06);

    height: 40px;

      { videoId: '8z1joLLT0uk', title: 'Mijares - Bano de Mujeres' },
      { videoId: '58R_K4xWZ-s', title: 'Emmanuel - La Chica de Humo' },

      { videoId: 'Mfrj-HIdYVg', title: 'Buena Vista Social Club - La Bayamesa' },
      { videoId: '-FoGSw3M5po', title: 'Caifanes - Viento' },
      { videoId: 'bC1Ucg_9yg4', title: 'Caifanes - La Negra Tomasa' },
      { videoId: 'raW309TfeQ8', title: 'La Sonora Dinamita - Pollera Colora' },
      { videoId: '_yYxeGYmnY4', title: 'Tito Nieves - Fabricando Fantasias' },
      { videoId: 'SXJkhaBi3xI', title: 'Calibre 50 - Si Te Pudiera Mentir' },
      { videoId: 'AztgSqsBx_A', title: 'Fruko y Sus Tesos - Cachondea' },
      { videoId: 'hmj6rdRbQpA', title: 'BOUQUER - Solo Hay un Ganador (Salsa)' },
      { videoId: 'qTS0fXOp9cI', title: 'Kany Garcia, Carin Leon - Te Lo Agradezco' },
      { videoId: 'CIcDWHxR-ao', title: 'Willie Colon - Idilio' },
      { videoId: 'oKOtzIo-uYw', title: 'Fugees - Killing Me Softly' }
    ];

    // ===================== ESTADO LOCAL (nada de esto se comparte con nadie) =====================
    let cola = [];              // canciones que TÚ agregaste, en orden
    let sonando = null;         // {videoId, title, thumbnail, esRespaldo}
    let ultimosRespaldo = [];   // evita repetir la misma canción de respaldo dos veces seguidas

    // ===================== REPRODUCTOR DE YOUTUBE =====================
    let ytPlayer = null;
    let ytListo = false;
    let audioDesbloqueado = false;

    const tagScript = document.createElement('script');
    tagScript.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tagScript);

    window.onYouTubeIframeAPIReady = function () {
      ytPlayer = new YT.Player('yt-player', {
        height: '1',
        width: '1',
        playerVars: { autoplay: 0, controls: 0, disablekb: 1, playsinline: 1 },
        events: {
          onReady: () => { ytListo = true; },
          onStateChange: onPlayerStateChange,
          onError: () => avanzar()
        }
      });
    };

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.ENDED) avanzar();
    }

    // ===================== RENDER =====================
    const npTitulo = document.getElementById('np-titulo');
    const npSub = document.getElementById('np-sub');
    const npThumb = document.getElementById('np-thumb');
    const colaListaDiv = document.getElementById('cola-lista');
    const colaCountSpan = document.getElementById('cola-count');

    function escapeHtml(str) {
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    function pintarNowPlaying() {
      if (!sonando) {
        npTitulo.textContent = 'Dale "Escuchar" para empezar';
        npSub.textContent = '';
        npThumb.src = '';
        return;
      }
      npTitulo.textContent = sonando.title;
      npSub.textContent = sonando.esRespaldo ? '📻 Playlist de Next Level 7' : '🎧 Elegiste tú';
      npThumb.src = sonando.thumbnail || ('https://i.ytimg.com/vi/' + sonando.videoId + '/hqdefault.jpg');
    }

    function pintarCola() {
      colaCountSpan.textContent = cola.length;
      colaListaDiv.innerHTML = '';
      cola.forEach(song => {
        const fila = document.createElement('div');
        fila.className = 'item-fila';
        fila.innerHTML = `
          <img src="${song.thumbnail}">
          <div class="info"><div class="titulo">${escapeHtml(song.title)}</div></div>
        `;
        colaListaDiv.appendChild(fila);
      });
    }

    // ===================== AVANZAR (elige lo que sigue) =====================
    function siguienteRespaldo() {
      if (ultimosRespaldo.length >= PLAYLIST_RESPALDO.length) ultimosRespaldo = [];
      let candidato;
      do {
        candidato = PLAYLIST_RESPALDO[Math.floor(Math.random() * PLAYLIST_RESPALDO.length)];
      } while (ultimosRespaldo.includes(candidato.videoId) && PLAYLIST_RESPALDO.length > 1);
      ultimosRespaldo.push(candidato.videoId);
      return candidato;
    }

    function avanzar() {
      if (cola.length > 0) {
        sonando = cola.shift();
        sonando.esRespaldo = false;
      } else {
        const song = siguienteRespaldo();
        sonando = {
          videoId: song.videoId,
          title: song.title,
          thumbnail: 'https://i.ytimg.com/vi/' + song.videoId + '/hqdefault.jpg',
          esRespaldo: true
        };
      }
      pintarNowPlaying();
      pintarCola();
      if (ytListo) {
        ytPlayer.loadVideoById({ videoId: sonando.videoId, startSeconds: 0 });
        if (audioDesbloqueado) setTimeout(() => { try { ytPlayer.playVideo(); } catch (e) {} }, 300);
      }
    }

    // ===================== BÚSQUEDA =====================
    const inputBuscar = document.getElementById('input-buscar');
    const btnBuscar = document.getElementById('btn-buscar');
    const resultadosDiv = document.getElementById('resultados');
    const estadoMsg = document.getElementById('estado-msg');

    async function buscarCanciones() {
      const q = inputBuscar.value.trim();
      if (!q) return;
      btnBuscar.disabled = true;
      estadoMsg.textContent = 'Buscando...';
      resultadosDiv.innerHTML = '';
      try {
        const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoCategoryId=10&maxResults=8&q=${encodeURIComponent(q)}&key=${YOUTUBE_API_KEY}`;
        const res = await fetch(url);
        const data = await res.json();
        if (!res.ok) {
          estadoMsg.textContent = 'Error al buscar: ' + (data.error?.message || res.status);
          btnBuscar.disabled = false;
          return;
        }
        estadoMsg.textContent = '';
        (data.items || []).forEach(item => {
          const fila = document.createElement('div');
          fila.className = 'item-fila';
          fila.innerHTML = `
            <img src="${item.snippet.thumbnails.default.url}">
            <div class="info">
              <div class="titulo">${escapeHtml(item.snippet.title)}</div>
              <div class="sub">${escapeHtml(item.snippet.channelTitle)}</div>
            </div>
            <button>Agregar</button>
          `;
          fila.querySelector('button').addEventListener('click', () => {
            const song = {
              videoId: item.id.videoId,
              title: item.snippet.title,
              thumbnail: item.snippet.thumbnails.default.url
            };
            cola.push(song);
            pintarCola();
            if (!sonando || sonando.esRespaldo) {
              // Si solo estaba sonando algo de la playlist de respaldo, tu elección se antepone ya.
              if (sonando && sonando.esRespaldo) avanzar();
              else if (!sonando) avanzar();
            }
          });
          resultadosDiv.appendChild(fila);
        });
      } catch (err) {
        estadoMsg.textContent = 'Error de conexión al buscar.';
      }
      btnBuscar.disabled = false;
    }
    btnBuscar.addEventListener('click', buscarCanciones);
    inputBuscar.addEventListener('keydown', (e) => { if (e.key === 'Enter') buscarCanciones(); });

    // ===================== SALTAR =====================
    document.getElementById('btn-saltar').addEventListener('click', () => {
      avanzar();
    });

    // ===================== DESBLOQUEO DE AUDIO (autoplay del navegador) =====================
    const btnEscuchar = document.getElementById('btn-escuchar');
    btnEscuchar.addEventListener('click', () => {
      audioDesbloqueado = true;
      btnEscuchar.textContent = '🔊 Reproduciendo';
      btnEscuchar.disabled = true;
      btnEscuchar.style.opacity = '0.6';
      if (!sonando) avanzar();
      else if (ytListo) { try { ytPlayer.playVideo(); } catch (e) {} }
    });
  </script>
